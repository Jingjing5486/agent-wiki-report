[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-wiki-demo"
version = "0.2.0"
description = "Reproducible document-to-wiki generation experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
api = ["certifi>=2024.2.2"]
prep = ["pymupdf>=1.25,<2"]

[project.scripts]
wiki-demo = "wiki_demo.cli:main"

[tool.setuptools.packages.find]
include = ["wiki_demo*"]
